<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Biotech Voyager — Workspace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg:      #020A14;
  --surf:    #07101C;
  --surf2:   #0B1625;
  --surf3:   #101E30;
  --surf4:   #152238;
  --acc:     #38BEFF;
  --acc-dim: rgba(56,190,255,0.11);
  --acc-bdr: rgba(56,190,255,0.22);
  --acc-glo: rgba(56,190,255,0.35);
  --txt:     #EEEEF3;
  --txt2:    #8888A0;
  --txt3:    #4A4A60;
  --bdr:     rgba(56,190,255,0.07);
  --bdr2:    rgba(56,190,255,0.13);
  --bdr3:    rgba(56,190,255,0.20);
  --grn:     #22C55E;
  --grn-dim: rgba(34,197,94,0.11);
  --grn-bdr: rgba(34,197,94,0.22);
  --amb:     #F59E0B;
  --err:     #FF6B6B;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--txt);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}

/* ── HEADER ─────────────────────────────────── */
.bv-header {
  position: relative;
  background-image: url('Assets/The Biotech Voyager/Graphics/The Biotech Voyager Logo Reveal (0;00;10;24).jpg');
  background-size: cover; background-position: center 30%;
  border-bottom: 1px solid var(--bdr3);
}
.bv-header::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(2,8,20,0.60); pointer-events: none;
}
.bv-header-inner {
  position: relative;
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 20px;
  max-width: 1320px; margin: 0 auto; padding: 24px 32px;
}
.bv-header-left { display: flex; align-items: center; gap: 14px; }
.bv-back {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--txt2); text-decoration: none;
  background: rgba(7,16,28,0.75); border: 1px solid var(--bdr2);
  padding: 6px 12px; border-radius: 4px; transition: color 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.bv-back:hover { color: var(--txt); border-color: var(--bdr3); }
.bv-header-center { display: flex; justify-content: center; align-items: center; }
.bv-logo-img {
  height: 44px; width: auto;
  filter: drop-shadow(0 0 20px rgba(56,190,255,0.28));
}
.bv-header-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.bv-live-badge {
  display: none; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase;
  color: var(--acc); background: var(--acc-dim); border: 1px solid var(--acc-bdr);
  padding: 5px 10px; border-radius: 3px;
}
.bv-live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--acc);
  box-shadow: 0 0 8px var(--acc-glo);
  animation: bv-pulse 2s ease-in-out infinite;
}
@keyframes bv-pulse {
  0%,100% { opacity:1; box-shadow:0 0 8px var(--acc-glo); }
  50%      { opacity:0.45; box-shadow:0 0 3px var(--acc-glo); }
}
.bv-date {
  font-size: 11px; font-weight: 600; color: var(--txt2);
  background: rgba(7,16,28,0.75); border: 1px solid var(--bdr2);
  padding: 6px 14px; border-radius: 4px; letter-spacing: 0.03em;
}

/* ── MILESTONE BAR ───────────────────────────── */
.ms-bar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(3,9,20,0.96);
  border-bottom: 1px solid var(--bdr2);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.ms-bar-inner {
  display: grid; grid-template-columns: 1fr 1fr 1fr auto;
  max-width: 1320px; margin: 0 auto; padding: 0 32px;
}
.ms-group {
  padding: 11px 18px 11px 0; border-right: 1px solid var(--bdr);
}
.ms-group:last-of-type { border-right: none; }
.ms-total-box {
  padding: 11px 0 11px 20px;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
}
.ms-lbl {
  font-size: 7.5px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--txt3); margin-bottom: 5px;
}
.ms-vals {
  display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px;
}
.ms-cur {
  font-size: 14px; font-weight: 800; color: var(--acc); letter-spacing: -0.02em;
  background: transparent; border: none; border-bottom: 1px solid transparent;
  width: 76px; font-family: inherit; transition: border-color 0.15s;
}
.ms-cur:focus { outline: none; border-bottom-color: var(--acc); }
.ms-cur[readonly] { cursor: default; color: var(--txt2); font-size: 13px; }
.ms-arrow { font-size: 11px; color: var(--txt3); }
.ms-target { font-size: 11px; font-weight: 600; color: var(--txt2); }
.ms-track {
  height: 3px; background: var(--bdr2); border-radius: 2px; margin-bottom: 4px; overflow: hidden;
}
.ms-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--acc), rgba(56,190,255,0.55));
  border-radius: 2px; transition: width 0.45s ease; width: 0%;
}
.ms-foot {
  display: flex; justify-content: space-between; align-items: baseline;
}
.ms-foot-cur { font-size: 8.5px; color: var(--txt3); font-weight: 600; }
.ms-foot-bonus { font-size: 8.5px; font-weight: 800; color: var(--grn); letter-spacing: 0.03em; }
.ms-total-lbl {
  font-size: 7.5px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--txt3); margin-bottom: 3px;
}
.ms-total-val { font-size: 20px; font-weight: 900; color: var(--grn); letter-spacing: -0.03em; }

/* ── LAYOUT ─────────────────────────────────── */
.bv-content {
  max-width: 1320px; margin: 0 auto; padding: 22px 32px 80px;
}

/* ── TABS ────────────────────────────────────── */
.bv-tab-nav {
  display: flex; gap: 0; margin-bottom: 18px;
  border-bottom: 1px solid var(--bdr2);
}
.bv-tab-btn {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--txt3); background: transparent; border: none; border-bottom: 2px solid transparent;
  padding: 10px 22px; margin-bottom: -1px; cursor: pointer; font-family: inherit;
  transition: color 0.15s, border-color 0.15s;
}
.bv-tab-btn:hover { color: var(--txt2); }
.bv-tab-btn.active { color: var(--acc); border-bottom-color: var(--acc); }
.hidden { display: none !important; }

/* ── SECTION CARD ───────────────────────────── */
.bv-card {
  background: var(--surf); border: 1px solid var(--bdr); border-radius: 8px;
  overflow: hidden; margin-bottom: 12px;
  box-shadow: 0 2px 14px rgba(0,0,0,0.38);
}
.card-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: var(--surf2); border-bottom: 1px solid var(--bdr);
}
.card-title {
  font-size: 9px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--txt3);
}
.card-body { padding: 16px 20px; }

/* ── WEEKLY FOCUS ───────────────────────────── */
.focus-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.focus-field label {
  display: block; font-size: 8px; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--txt3); margin-bottom: 5px;
}
.focus-field input {
  width: 100%; background: var(--surf2); border: 1px solid var(--bdr2);
  color: var(--txt); font-size: 12px; font-weight: 500; padding: 8px 10px;
  border-radius: 4px; font-family: inherit; transition: border-color 0.15s;
}
.focus-field input:focus { outline: none; border-color: var(--acc); }
.focus-field input::placeholder { color: var(--txt3); font-weight: 400; }

/* ── EPISODE CARDS ──────────────────────────── */
#episodes-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.ep-card {
  background: var(--surf); border: 1px solid var(--bdr); border-radius: 8px;
  overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.32);
}
.ep-hdr {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 13px 18px; background: var(--surf2);
  border-bottom: 2px solid var(--acc); position: relative;
}
.ep-hdr::after {
  content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px;
  background: var(--acc); box-shadow: 0 0 14px 2px var(--acc-glo);
}
.ep-title-inp {
  flex: 1; min-width: 160px; background: transparent; border: none;
  border-bottom: 1px solid transparent; color: var(--txt);
  font-size: 14px; font-weight: 700; font-family: inherit;
  padding: 2px 4px; letter-spacing: 0.02em; transition: border-color 0.15s;
}
.ep-title-inp:focus { outline: none; border-bottom-color: var(--acc); }
.ep-title-inp::placeholder { color: var(--txt3); font-weight: 400; }
.ep-date-inp {
  font-size: 11px; font-weight: 600; color: var(--txt2);
  background: var(--surf3); border: 1px solid var(--bdr2);
  padding: 5px 8px; border-radius: 4px; font-family: inherit; color-scheme: dark;
  transition: border-color 0.15s; flex-shrink: 0;
}
.ep-date-inp:focus { outline: none; border-color: var(--acc); }
.day-toggle { display: flex; gap: 3px; flex-shrink: 0; }
.day-btn {
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  padding: 5px 9px; border-radius: 3px; border: 1px solid var(--bdr2);
  background: transparent; color: var(--txt3); cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.day-btn.active { background: var(--acc-dim); border-color: var(--acc-bdr); color: var(--acc); }
.live-tog { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; flex-shrink: 0; }
.live-tog input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.live-tog-track {
  width: 30px; height: 16px; border-radius: 8px;
  background: var(--surf3); border: 1px solid var(--bdr2);
  position: relative; transition: background 0.2s, border-color 0.2s; flex-shrink: 0;
}
.live-tog input:checked ~ .live-tog-track { background: var(--acc-dim); border-color: var(--acc-bdr); }
.live-tog-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--txt3);
  position: absolute; top: 2px; left: 2px; transition: all 0.2s;
}
.live-tog input:checked ~ .live-tog-track .live-tog-thumb { background: var(--acc); left: 16px; box-shadow: 0 0 6px var(--acc-glo); }
.live-tog-lbl { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; color: var(--txt3); transition: color 0.15s; }
.live-tog input:checked ~ .live-tog-lbl { color: var(--acc); }
.ep-del-btn {
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; color: var(--txt3); cursor: pointer;
  font-size: 18px; line-height: 1; border-radius: 4px; font-family: inherit; flex-shrink: 0;
  margin-left: auto; transition: color 0.15s, background 0.15s;
}
.ep-del-btn:hover { color: var(--err); background: rgba(255,107,107,0.1); }

/* Clip/LF/Podcast sections */
.ep-clips, .ep-lf, .ep-podcast {
  padding: 11px 18px; border-bottom: 1px solid var(--bdr);
}
.ep-podcast { border-bottom: none; }
.sub-lbl {
  font-size: 7.5px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--txt3); margin-bottom: 8px;
}
.clips-col-hdr {
  display: grid; grid-template-columns: 16px 1fr 26px 26px 26px 26px;
  gap: 6px; align-items: center; padding-bottom: 5px; margin-bottom: 3px;
  border-bottom: 1px solid var(--bdr);
}
.clips-col-hdr-icn { display: flex; justify-content: center; align-items: center; }
.clips-col-hdr-icn svg { width: 11px; height: 11px; color: var(--txt3); }
.clip-row {
  display: grid; grid-template-columns: 16px 1fr 26px 26px 26px 26px;
  gap: 6px; align-items: center; padding: 4px 0;
  border-bottom: 1px solid rgba(56,190,255,0.035);
}
.clip-row:last-child { border-bottom: none; }
.clip-num { font-size: 8.5px; font-weight: 700; color: var(--txt3); text-align: center; }
.clip-inp {
  background: transparent; border: none; border-bottom: 1px solid transparent;
  color: var(--txt); font-size: 12px; font-weight: 500; font-family: inherit;
  padding: 2px 3px; width: 100%; transition: border-color 0.15s;
}
.clip-inp:focus { outline: none; border-bottom-color: var(--acc); }
.clip-inp::placeholder { color: var(--txt3); font-size: 11px; }
.plat-chk { display: flex; justify-content: center; align-items: center; cursor: pointer; }
.plat-chk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.plat-icn {
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  border-radius: 4px; border: 1px solid var(--bdr2); background: var(--surf2);
  transition: all 0.15s;
}
.plat-icn svg { width: 11px; height: 11px; color: var(--txt3); transition: color 0.15s; }
.plat-chk input:checked + .plat-icn { background: var(--acc-dim); border-color: var(--acc-bdr); }
.plat-chk input:checked + .plat-icn svg { color: var(--acc); }
.plat-chk:hover .plat-icn { border-color: var(--bdr3); }

/* Long form */
.lf-row-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
.lf-add-btn {
  font-size: 9px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--acc); background: var(--acc-dim); border: 1px solid var(--acc-bdr);
  padding: 4px 10px; border-radius: 3px; cursor: pointer; font-family: inherit;
  transition: background 0.15s;
}
.lf-add-btn:hover { background: rgba(56,190,255,0.2); }
.lf-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 0; border-bottom: 1px solid rgba(56,190,255,0.035);
}
.lf-row:last-child { border-bottom: none; }
.lf-inp {
  flex: 1; background: transparent; border: none; border-bottom: 1px solid transparent;
  color: var(--txt); font-size: 12px; font-weight: 500; font-family: inherit;
  padding: 2px 3px; transition: border-color 0.15s;
}
.lf-inp:focus { outline: none; border-bottom-color: var(--acc); }
.lf-inp::placeholder { color: var(--txt3); font-size: 11px; }
.lf-del {
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; color: var(--txt3); cursor: pointer;
  font-size: 16px; line-height: 1; border-radius: 3px; font-family: inherit; flex-shrink: 0;
  transition: color 0.15s;
}
.lf-del:hover { color: var(--err); }
.lf-empty { font-size: 10px; color: var(--txt3); }

/* Podcast row */
.pod-row { display: flex; align-items: center; gap: 18px; }
.pod-plat { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
.pod-plat input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pod-icn {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: 5px; border: 1px solid var(--bdr2); background: var(--surf2); transition: all 0.15s;
}
.pod-icn svg { width: 13px; height: 13px; color: var(--txt3); transition: color 0.15s; }
.pod-plat input:checked + .pod-icn { background: var(--acc-dim); border-color: var(--acc-bdr); }
.pod-plat input:checked + .pod-icn svg { color: var(--acc); }
.pod-plat-name { font-size: 10px; font-weight: 600; color: var(--txt3); }
.pod-plat input:checked ~ .pod-plat-name { color: var(--txt2); }

.add-ep-btn {
  width: 100%; padding: 13px; background: var(--surf); border: 1px dashed var(--bdr2);
  color: var(--txt3); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; cursor: pointer; border-radius: 8px; font-family: inherit;
  transition: all 0.15s;
}
.add-ep-btn:hover { border-color: var(--acc-bdr); color: var(--acc); background: var(--acc-dim); }

/* ── PERFORMANCE ─────────────────────────────── */
.ai-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.ai-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--bg); background: var(--acc); border: none;
  padding: 10px 22px; border-radius: 5px; cursor: pointer; font-family: inherit;
  box-shadow: 0 0 22px var(--acc-glo); transition: box-shadow 0.15s, opacity 0.15s;
}
.ai-btn:hover { box-shadow: 0 0 34px var(--acc-glo); }
.ai-btn:disabled { opacity: 0.55; cursor: default; }
.ai-result {
  background: var(--surf2); border: 1px solid var(--acc-bdr); border-radius: 8px;
  padding: 16px 18px; font-size: 13px; color: var(--txt); line-height: 1.68;
  margin-bottom: 18px;
}
.ai-loading { color: var(--txt2); font-size: 12px; font-style: italic; }
.api-err { color: var(--err); font-size: 12px; }

#perf-container { display: flex; flex-direction: column; gap: 12px; }
.perf-card {
  background: var(--surf); border: 1px solid var(--bdr); border-radius: 8px;
  overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.perf-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 18px; background: var(--surf2); border-bottom: 1px solid var(--bdr);
}
.perf-crumb { font-size: 10px; color: var(--txt3); font-weight: 600; }
.perf-crumb strong { color: var(--txt2); font-weight: 700; }
.perf-plat-row {
  padding: 12px 18px; border-bottom: 1px solid var(--bdr);
}
.perf-plat-row:last-of-type { border-bottom: none; }
.perf-plat-hdr {
  display: flex; align-items: center; gap: 8px; margin-bottom: 9px;
}
.perf-plat-hdr svg { width: 13px; height: 13px; color: var(--acc); }
.perf-plat-name { font-size: 9px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--txt2); }
.perf-stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.perf-stat label {
  display: block; font-size: 7.5px; font-weight: 800; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--txt3); margin-bottom: 4px;
}
.perf-stat input {
  width: 100%; background: var(--surf2); border: 1px solid var(--bdr2);
  color: var(--txt); font-size: 13px; font-weight: 700; padding: 6px 8px;
  border-radius: 4px; font-family: inherit; font-variant-numeric: tabular-nums;
  transition: border-color 0.15s;
}
.perf-stat input:focus { outline: none; border-color: var(--acc); }
.perf-stat input::placeholder { color: var(--txt3); font-weight: 400; font-size: 11px; }
.perf-meta { padding: 14px 18px; }
.perf-meta-grid { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 14px; }
.hook-col label {
  display: block; font-size: 7.5px; font-weight: 800; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--txt3); margin-bottom: 7px;
}
.stars { display: flex; gap: 3px; }
.star { font-size: 20px; cursor: pointer; color: var(--txt3); transition: color 0.1s; line-height: 1; }
.star.lit { color: var(--acc); }
.star:hover { color: var(--acc); }
.note-col label {
  display: block; font-size: 7.5px; font-weight: 800; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--txt3); margin-bottom: 5px;
}
.note-col textarea {
  width: 100%; background: var(--surf2); border: 1px solid var(--bdr2);
  color: var(--txt); font-size: 12px; padding: 8px 10px; border-radius: 4px;
  font-family: inherit; resize: vertical; min-height: 62px; transition: border-color 0.15s;
}
.note-col textarea:focus { outline: none; border-color: var(--acc); }
.note-col textarea::placeholder { color: var(--txt3); font-size: 11px; }
.perf-empty { padding: 32px; text-align: center; color: var(--txt3); font-size: 12px; }

/* ── ANALYTICS ───────────────────────────────── */
.an-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.an-field label {
  display: block; font-size: 8px; font-weight: 800; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--txt3); margin-bottom: 5px;
}
.an-field input {
  width: 100%; background: var(--surf2); border: 1px solid var(--bdr2);
  color: var(--txt); font-size: 15px; font-weight: 800; padding: 8px 10px;
  border-radius: 4px; font-family: inherit; font-variant-numeric: tabular-nums;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.an-field input:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc-dim); }
.an-field input::placeholder { color: var(--txt3); font-weight: 400; font-size: 12px; }

/* ── SETTINGS ROW ───────────────────────────── */
.settings-row { display: flex; gap: 10px; align-items: center; }
.settings-row input {
  flex: 1; background: var(--surf2); border: 1px solid var(--bdr2);
  color: var(--txt); font-size: 12px; padding: 8px 12px; border-radius: 4px;
  font-family: inherit; transition: border-color 0.15s;
}
.settings-row input:focus { outline: none; border-color: var(--acc); }
.settings-row input::placeholder { color: var(--txt3); }

/* ── GROWTH PLAN ─────────────────────────────── */
.growth-result {
  margin-top: 14px; background: var(--surf2); border: 1px solid var(--bdr2);
  border-radius: 8px; padding: 18px 20px; font-size: 13px; color: var(--txt);
  line-height: 1.72; white-space: pre-wrap;
}

/* ── NOTES ───────────────────────────────────── */
.notes-ta {
  width: 100%; background: var(--surf2); border: 1px solid var(--bdr2);
  color: var(--txt); font-size: 13px; padding: 12px 14px;
  border-radius: 6px; font-family: inherit; resize: vertical; min-height: 120px;
  transition: border-color 0.15s;
}
.notes-ta:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc-dim); }
.notes-ta::placeholder { color: var(--txt3); }

/* ── BUTTONS ─────────────────────────────────── */
.bv-btn {
  font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 9px 18px; border-radius: 5px; cursor: pointer; font-family: inherit;
  border: 1px solid var(--acc-bdr); color: var(--acc); background: var(--acc-dim);
  transition: background 0.15s, box-shadow 0.15s;
}
.bv-btn:hover { background: rgba(56,190,255,0.22); }
.bv-btn:disabled { opacity: 0.5; cursor: default; }
.empty-state { padding: 24px; text-align: center; color: var(--txt3); font-size: 11px; font-weight: 500; }
</style>

<script>
/* ── CONSTANTS ───────────────────────────────── */
const MS = {
  ytSubs:  [{t:1000,b:500},{t:10000,b:2500},{t:50000,b:10000},{t:100000,b:50000}],
  ytViews: [{t:100000,b:500},{t:1000000,b:5000},{t:10000000,b:20000}],
  social:  [{t:5000,b:1000},{t:25000,b:3000},{t:100000,b:10000},{t:500000,b:25000}]
};
const PLATS      = ['shorts','ig','tiktok','linkedin'];
const PLAT_NAMES = {shorts:'Shorts',ig:'Instagram',tiktok:'TikTok',linkedin:'LinkedIn'};
const PLAT_ICONS = {shorts:'ic-yt',ig:'ic-ig',tiktok:'ic-tt',linkedin:'ic-li'};
const POD_PLATS  = ['youtube','spotify','apple'];
const POD_NAMES  = {youtube:'YouTube',spotify:'Spotify',apple:'Apple Podcasts'};
const POD_ICONS  = {youtube:'ic-yt',spotify:'ic-sp',apple:'ic-ap'};

/* ── STATE ───────────────────────────────────── */
let bvPipeline    = {weeklyFocus:{priority:'',blockedOn:'',nextDelivery:''},episodes:[]};
let bvAnalytics   = {ytViews:0,ytSubs:0,shortsViews:0,ig:0,tiktok:0,linkedin:0,x:0,spotify:0,apple:0};
let bvPerformance = {};
let bvNotes       = '';
let bvApiKey      = '';
let bvAiResult    = '';
let bvGrowthResult= '';

/* ── SAVE / LOAD ─────────────────────────────── */
function savePipeline()    { localStorage.setItem('bv_pipeline',    JSON.stringify(bvPipeline)); }
function saveAnalytics()   { localStorage.setItem('bv_analytics',   JSON.stringify(bvAnalytics)); }
function savePerformance() { localStorage.setItem('bv_performance', JSON.stringify(bvPerformance)); }
function saveNotes()       { bvNotes = document.getElementById('bv-notes').value; localStorage.setItem('bv_notes', bvNotes); }
function saveApiKey()      { bvApiKey = document.getElementById('api-key-inp').value; localStorage.setItem('bv_api_key', bvApiKey); }
function saveWeeklyFocus() {
  bvPipeline.weeklyFocus = {
    priority:     document.getElementById('wf-priority').value,
    blockedOn:    document.getElementById('wf-blocked').value,
    nextDelivery: document.getElementById('wf-next').value
  };
  savePipeline();
}

function loadAll() {
  try { const s = localStorage.getItem('bv_pipeline');    if (s) bvPipeline    = JSON.parse(s); } catch(e){}
  try { const s = localStorage.getItem('bv_analytics');   if (s) bvAnalytics   = JSON.parse(s); } catch(e){}
  try { const s = localStorage.getItem('bv_performance'); if (s) bvPerformance = JSON.parse(s); } catch(e){}
  bvNotes        = localStorage.getItem('bv_notes')    || '';
  bvApiKey       = localStorage.getItem('bv_api_key')  || '';
  bvAiResult     = localStorage.getItem('bv_ai_result')|| '';
  bvGrowthResult = localStorage.getItem('bv_growth_result') || '';

  // Populate UI from state
  document.getElementById('bv-notes').value        = bvNotes;
  document.getElementById('api-key-inp').value      = bvApiKey;
  document.getElementById('wf-priority').value      = bvPipeline.weeklyFocus.priority     || '';
  document.getElementById('wf-blocked').value       = bvPipeline.weeklyFocus.blockedOn    || '';
  document.getElementById('wf-next').value          = bvPipeline.weeklyFocus.nextDelivery || '';

  const AN_KEYS = ['ytViews','ytSubs','shortsViews','ig','tiktok','linkedin','x','spotify','apple'];
  AN_KEYS.forEach(k => {
    const el = document.getElementById('an-' + k);
    if (el && bvAnalytics[k]) el.value = bvAnalytics[k];
  });

  if (bvAiResult) {
    const el = document.getElementById('ai-insight-result');
    if (el) el.innerHTML = '<div class="ai-result">' + escHtml(bvAiResult).replace(/\n/g,'<br>') + '</div>';
  }
  if (bvGrowthResult) {
    const el = document.getElementById('growth-result');
    if (el) el.innerHTML = '<div class="growth-result">' + escHtml(bvGrowthResult) + '</div>';
  }

  renderMilestones();
  renderPipeline();
}

/* ── ANALYTICS UPDATE ────────────────────────── */
function updateAnalytic(key, value) {
  bvAnalytics[key] = parseFloat(value) || 0;
  saveAnalytics();
  renderMilestones();
  // Sync milestone bar inputs ↔ analytics inputs
  const msEl = document.getElementById('ms-' + key);
  const anEl = document.getElementById('an-' + key);
  if (msEl && msEl !== document.activeElement) msEl.value = value || '';
  if (anEl && anEl !== document.activeElement) anEl.value = value || '';
}

/* ── LIVE BADGE ──────────────────────────────── */
function isLive() {
  const now = new Date();
  const ny  = new Date(now.toLocaleString('en-US', {timeZone:'America/New_York'}));
  const day = ny.getDay();
  const min = ny.getHours() * 60 + ny.getMinutes();
  return (day === 2 || day === 4) && min >= 660 && min < 780;
}
function updateLiveBadge() {
  const b = document.getElementById('live-badge');
  if (b) b.style.display = isLive() ? 'flex' : 'none';
}

/* ── MILESTONES ──────────────────────────────── */
function fmtNum(n) {
  n = parseFloat(n) || 0;
  if (n >= 1e6) return (n/1e6).toFixed(n%1e6===0?0:1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(n%1e3===0?0:1)+'K';
  return n.toString();
}

function renderMilestones() {
  const subs   = parseFloat(bvAnalytics.ytSubs)   || 0;
  const views  = parseFloat(bvAnalytics.ytViews)  || 0;
  const social = (parseFloat(bvAnalytics.ig)||0) +
                 (parseFloat(bvAnalytics.tiktok)||0) +
                 (parseFloat(bvAnalytics.x)||0);

  // Sync milestone bar readonly fields
  const msSubsEl = document.getElementById('ms-ytSubs');
  const msViewsEl= document.getElementById('ms-ytViews');
  const msSocialEl=document.getElementById('ms-social');
  if (msSubsEl  && msSubsEl!==document.activeElement)  msSubsEl.value  = subs  || '';
  if (msViewsEl && msViewsEl!==document.activeElement) msViewsEl.value = views || '';
  if (msSocialEl) msSocialEl.value = social || '';

  let totalEarned = 0;

  function calcGroup(key, cur, milestones, fillId, targetId, curId, bonusId) {
    let earned = 0, nextMs = null;
    let prevT = 0;
    for (const m of milestones) {
      if (cur >= m.t) { earned += m.b; prevT = m.t; }
      else if (!nextMs) nextMs = m;
    }
    totalEarned += earned;

    const fill   = document.getElementById(fillId);
    const target = document.getElementById(targetId);
    const curEl  = document.getElementById(curId);
    const bonus  = document.getElementById(bonusId);

    if (!nextMs) {
      if (fill)   fill.style.width = '100%';
      if (target) target.textContent = 'MAX';
      if (curEl)  curEl.textContent  = fmtNum(cur) + ' ✓';
      if (bonus)  bonus.textContent  = 'All done!';
    } else {
      const range = nextMs.t - prevT;
      const pct   = Math.min(100, Math.max(0, ((cur - prevT) / range) * 100));
      if (fill)   fill.style.width = pct + '%';
      if (target) target.textContent = fmtNum(nextMs.t);
      if (curEl)  curEl.textContent  = fmtNum(cur) + ' / ' + fmtNum(nextMs.t);
      if (bonus)  bonus.textContent  = '+$' + nextMs.b.toLocaleString();
    }
  }

  calcGroup('ytSubs',  subs,   MS.ytSubs,  'ms-subs-fill',   'ms-subs-target',   'ms-subs-cur',   'ms-subs-bonus');
  calcGroup('ytViews', views,  MS.ytViews, 'ms-views-fill',  'ms-views-target',  'ms-views-cur',  'ms-views-bonus');
  calcGroup('social',  social, MS.social,  'ms-social-fill', 'ms-social-target', 'ms-social-cur', 'ms-social-bonus');

  const t = document.getElementById('ms-total');
  if (t) t.textContent = '$' + totalEarned.toLocaleString();
}

/* ── PIPELINE ────────────────────────────────── */
function addEpisode() {
  bvPipeline.episodes.push({
    id: 'ep_' + Date.now(),
    title: '', date: '', day: 'TUE', isLive: false,
    clips: Array.from({length:5}, (_,i) => ({
      id: 'clip_' + Date.now() + '_' + i + '_' + Math.floor(Math.random()*9999),
      title: '',
      platforms: {shorts:false, ig:false, tiktok:false, linkedin:false}
    })),
    longForms: [],
    podcast: {youtube:false, spotify:false, apple:false}
  });
  savePipeline(); renderPipeline();
  // Scroll to new card
  const cards = document.querySelectorAll('.ep-card');
  if (cards.length) cards[cards.length-1].scrollIntoView({behavior:'smooth', block:'nearest'});
}

function deleteEpisode(id) {
  bvPipeline.episodes = bvPipeline.episodes.filter(e => e.id !== id);
  savePipeline(); renderPipeline();
}

function updateEpTitle(id, val) {
  const ep = bvPipeline.episodes.find(e => e.id === id);
  if (ep) { ep.title = val; savePipeline(); }
}
function updateEpDate(id, val) {
  const ep = bvPipeline.episodes.find(e => e.id === id);
  if (ep) { ep.date = val; savePipeline(); }
}
function setEpDay(id, day) {
  const ep = bvPipeline.episodes.find(e => e.id === id);
  if (!ep) return;
  ep.day = day; savePipeline();
  document.querySelectorAll(`#ep-${id.replace('_','\\\\3A ')} .day-btn`).forEach(b => {
    b.classList.toggle('active', b.dataset.day === day);
  });
  // re-render just the day badges
  renderEpDayBtns(id, day);
}
function renderEpDayBtns(id, day) {
  document.querySelectorAll('.day-btn[data-ep="' + id + '"]').forEach(b => {
    b.classList.toggle('active', b.dataset.day === day);
  });
}
function toggleEpLive(id, checked) {
  const ep = bvPipeline.episodes.find(e => e.id === id);
  if (ep) { ep.isLive = checked; savePipeline(); }
}
function updateClipTitle(epId, clipId, val) {
  const ep = bvPipeline.episodes.find(e => e.id === epId);
  if (!ep) return;
  const clip = ep.clips.find(c => c.id === clipId);
  if (clip) { clip.title = val; savePipeline(); }
}
function toggleClipPlatform(epId, clipId, platform, checked) {
  const ep = bvPipeline.episodes.find(e => e.id === epId);
  if (!ep) return;
  const clip = ep.clips.find(c => c.id === clipId);
  if (clip) { clip.platforms[platform] = checked; savePipeline(); }
}
function addLongForm(epId) {
  const ep = bvPipeline.episodes.find(e => e.id === epId);
  if (!ep) return;
  ep.longForms.push({id: 'lf_' + Date.now(), title: '', youtube: false});
  savePipeline(); renderPipeline();
}
function deleteLongForm(epId, lfId) {
  const ep = bvPipeline.episodes.find(e => e.id === epId);
  if (!ep) return;
  ep.longForms = ep.longForms.filter(l => l.id !== lfId);
  savePipeline(); renderPipeline();
}
function updateLfTitle(epId, lfId, val) {
  const ep = bvPipeline.episodes.find(e => e.id === epId);
  if (!ep) return;
  const lf = ep.longForms.find(l => l.id === lfId);
  if (lf) { lf.title = val; savePipeline(); }
}
function toggleLfYt(epId, lfId, checked) {
  const ep = bvPipeline.episodes.find(e => e.id === epId);
  if (!ep) return;
  const lf = ep.longForms.find(l => l.id === lfId);
  if (lf) { lf.youtube = checked; savePipeline(); }
}
function togglePodcast(epId, platform, checked) {
  const ep = bvPipeline.episodes.find(e => e.id === epId);
  if (ep) { ep.podcast[platform] = checked; savePipeline(); }
}

function renderPipeline() {
  const container = document.getElementById('episodes-container');
  if (!container) return;
  if (!bvPipeline.episodes.length) {
    container.innerHTML = '<div class="empty-state">No episodes yet — click + Add Episode to start tracking</div>';
    return;
  }

  container.innerHTML = bvPipeline.episodes.map(ep => {
    // Clip column headers
    const colHdrHtml = `
      <div class="clips-col-hdr">
        <div></div><div></div>
        ${PLATS.map(p => `
          <div class="clips-col-hdr-icn" title="${PLAT_NAMES[p]}">
            <svg><use href="#${PLAT_ICONS[p]}"/></svg>
          </div>`).join('')}
      </div>`;

    // 5 clip rows
    const clipsHtml = ep.clips.map((clip, idx) => `
      <div class="clip-row">
        <span class="clip-num">${idx+1}</span>
        <input class="clip-inp" type="text" placeholder="Clip title…" value="${escHtml(clip.title)}"
               oninput="updateClipTitle('${ep.id}','${clip.id}',this.value)">
        ${PLATS.map(p => `
          <label class="plat-chk" title="${PLAT_NAMES[p]}">
            <input type="checkbox" ${clip.platforms[p]?'checked':''}
                   onchange="toggleClipPlatform('${ep.id}','${clip.id}','${p}',this.checked)">
            <div class="plat-icn"><svg><use href="#${PLAT_ICONS[p]}"/></svg></div>
          </label>`).join('')}
      </div>`).join('');

    // Long forms
    const lfRowsHtml = ep.longForms.length
      ? ep.longForms.map(lf => `
          <div class="lf-row">
            <label class="plat-chk" title="YouTube">
              <input type="checkbox" ${lf.youtube?'checked':''}
                     onchange="toggleLfYt('${ep.id}','${lf.id}',this.checked)">
              <div class="plat-icn"><svg><use href="#ic-yt"/></svg></div>
            </label>
            <input class="lf-inp" type="text" placeholder="Long form title…" value="${escHtml(lf.title)}"
                   oninput="updateLfTitle('${ep.id}','${lf.id}',this.value)">
            <button class="lf-del" onclick="deleteLongForm('${ep.id}','${lf.id}')" title="Remove">×</button>
          </div>`).join('')
      : '<span class="lf-empty">No long form cuts — click + Add</span>';

    // Full podcast
    const podHtml = POD_PLATS.map(p => `
      <label class="pod-plat">
        <input type="checkbox" ${ep.podcast[p]?'checked':''}
               onchange="togglePodcast('${ep.id}','${p}',this.checked)">
        <div class="pod-icn"><svg><use href="#${POD_ICONS[p]}"/></svg></div>
        <span class="pod-plat-name">${POD_NAMES[p]}</span>
      </label>`).join('');

    return `
    <div class="ep-card" id="ep-card-${ep.id}">
      <div class="ep-hdr">
        <input class="ep-title-inp" type="text" placeholder="Episode title…" value="${escHtml(ep.title)}"
               oninput="updateEpTitle('${ep.id}',this.value)">
        <input class="ep-date-inp" type="date" value="${ep.date||''}"
               onchange="updateEpDate('${ep.id}',this.value)">
        <div class="day-toggle">
          <button class="day-btn${ep.day==='TUE'?' active':''}" data-ep="${ep.id}" data-day="TUE"
                  onclick="setEpDay('${ep.id}','TUE')">TUE</button>
          <button class="day-btn${ep.day==='THU'?' active':''}" data-ep="${ep.id}" data-day="THU"
                  onclick="setEpDay('${ep.id}','THU')">THU</button>
        </div>
        <label class="live-tog">
          <input type="checkbox" ${ep.isLive?'checked':''}
                 onchange="toggleEpLive('${ep.id}',this.checked)">
          <div class="live-tog-track"><div class="live-tog-thumb"></div></div>
          <span class="live-tog-lbl">LIVE</span>
        </label>
        <button class="ep-del-btn" onclick="deleteEpisode('${ep.id}')" title="Delete episode">×</button>
      </div>

      <div class="ep-clips">
        <div class="sub-lbl">Clips</div>
        ${colHdrHtml}
        ${clipsHtml}
      </div>

      <div class="ep-lf">
        <div class="lf-row-hdr">
          <span class="sub-lbl" style="margin-bottom:0">Long Form</span>
          <button class="lf-add-btn" onclick="addLongForm('${ep.id}')">+ Add Cut</button>
        </div>
        ${lfRowsHtml}
      </div>

      <div class="ep-podcast">
        <div class="sub-lbl">Full Podcast</div>
        <div class="pod-row">${podHtml}</div>
      </div>
    </div>`;
  }).join('');
}

/* ── PERFORMANCE ─────────────────────────────── */
function getPostedClips() {
  const out = [];
  for (const ep of bvPipeline.episodes) {
    for (const clip of ep.clips) {
      if (PLATS.some(p => clip.platforms[p])) out.push({ep, clip});
    }
  }
  return out;
}

function updatePerfStat(clipId, platform, field, value) {
  bvPerformance[clipId] = bvPerformance[clipId] || {};
  bvPerformance[clipId].platforms = bvPerformance[clipId].platforms || {};
  bvPerformance[clipId].platforms[platform] = bvPerformance[clipId].platforms[platform] || {};
  bvPerformance[clipId].platforms[platform][field] = value;
  savePerformance();
}
function updatePerfMeta(clipId, field, value) {
  bvPerformance[clipId] = bvPerformance[clipId] || {};
  bvPerformance[clipId][field] = value;
  savePerformance();
}
function setHookRating(clipId, rating) {
  bvPerformance[clipId] = bvPerformance[clipId] || {};
  bvPerformance[clipId].hookRating = rating;
  savePerformance();
  document.querySelectorAll('#stars-' + clipId + ' .star').forEach((s,i) => {
    s.classList.toggle('lit', i < rating);
  });
}

function renderPerformance() {
  const container = document.getElementById('perf-container');
  if (!container) return;
  const posted = getPostedClips();
  if (!posted.length) {
    container.innerHTML = '<div class="perf-empty">No posted clips yet. Check platforms on clips in the Pipeline tab to track performance here.</div>';
    return;
  }
  container.innerHTML = posted.map(({ep, clip}) => {
    const perf     = bvPerformance[clip.id] || {};
    const platforms = PLATS.filter(p => clip.platforms[p]);
    const hookRating= perf.hookRating || 0;

    const platStatsHtml = platforms.map(p => {
      const s = (perf.platforms || {})[p] || {};
      return `
      <div class="perf-plat-row">
        <div class="perf-plat-hdr">
          <svg width="13" height="13"><use href="#${PLAT_ICONS[p]}"/></svg>
          <span class="perf-plat-name">${PLAT_NAMES[p]}</span>
        </div>
        <div class="perf-stat-grid">
          ${['views48','views7d','likes','comments'].map(f => `
            <div class="perf-stat">
              <label>${f==='views48'?'Views 48h':f==='views7d'?'Views 7d':f.charAt(0).toUpperCase()+f.slice(1)}</label>
              <input type="text" placeholder="—" value="${escHtml(s[f]||'')}"
                     oninput="updatePerfStat('${clip.id}','${p}','${f}',this.value)">
            </div>`).join('')}
        </div>
      </div>`;
    }).join('');

    const starsHtml = [1,2,3,4,5].map(n =>
      `<span class="star${n<=hookRating?' lit':''}" onclick="setHookRating('${clip.id}',${n})">★</span>`
    ).join('');

    return `
    <div class="perf-card">
      <div class="perf-hdr">
        <span class="perf-crumb">${escHtml(ep.title||'Episode')} › <strong>${escHtml(clip.title||'Clip')}</strong></span>
      </div>
      ${platStatsHtml}
      <div class="perf-meta">
        <div class="perf-meta-grid">
          <div class="hook-col">
            <label>Hook Rating</label>
            <div class="stars" id="stars-${clip.id}">${starsHtml}</div>
          </div>
          <div class="note-col">
            <label>Retention Note</label>
            <textarea placeholder="Did they watch past 10s?"
                      oninput="updatePerfMeta('${clip.id}','retentionNote',this.value)">${escHtml(perf.retentionNote||'')}</textarea>
          </div>
          <div class="note-col">
            <label>What Worked</label>
            <textarea placeholder="What landed well?"
                      oninput="updatePerfMeta('${clip.id}','whatWorked',this.value)">${escHtml(perf.whatWorked||'')}</textarea>
          </div>
          <div class="note-col">
            <label>What to Change</label>
            <textarea placeholder="What to improve?"
                      oninput="updatePerfMeta('${clip.id}','whatToChange',this.value)">${escHtml(perf.whatToChange||'')}</textarea>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── API CALLS ───────────────────────────────── */
async function callClaude(prompt, resultId, btnId, btnLabel) {
  const key = localStorage.getItem('bv_api_key') || '';
  if (!key) {
    document.getElementById(resultId).innerHTML = '<p class="api-err">Add your Anthropic API key in the API Settings section below.</p>';
    return;
  }
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = 'Thinking…'; }
  document.getElementById(resultId).innerHTML = '<div class="ai-loading">Analyzing…</div>';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-allow-browser': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{role:'user', content: prompt}]
      })
    });
    if (!res.ok) {
      const err = await res.json().catch(()=>({error:{message:'HTTP '+res.status}}));
      throw new Error(err.error?.message || 'HTTP ' + res.status);
    }
    const data = await res.json();
    const text = data.content[0].text;
    document.getElementById(resultId).innerHTML =
      '<div class="' + (resultId === 'growth-result' ? 'growth-result' : 'ai-result') +
      '">' + escHtml(text).replace(/\n/g,'<br>') + '</div>';
    localStorage.setItem('bv_' + (resultId === 'growth-result' ? 'growth_result' : 'ai_result'), text);
  } catch(e) {
    document.getElementById(resultId).innerHTML = '<p class="api-err">Error: ' + escHtml(e.message) + '</p>';
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '✦ ' + btnLabel; }
  }
}

function runAiInsight() {
  const posted = getPostedClips().slice(-5);
  if (!posted.length) {
    document.getElementById('ai-insight-result').innerHTML = '<p class="api-err">No posted clips yet. Check platforms on clips in the Pipeline tab first.</p>';
    return;
  }
  const clipData = posted.map(({ep, clip}) => {
    const perf = bvPerformance[clip.id] || {};
    const plats = PLATS.filter(p => clip.platforms[p]);
    const stats = plats.map(p => {
      const s = (perf.platforms||{})[p] || {};
      return `  ${PLAT_NAMES[p]}: ${s.views48||'—'} views/48h, ${s.views7d||'—'} views/7d, ${s.likes||'—'} likes, ${s.comments||'—'} comments`;
    }).join('\n');
    return `Clip: "${clip.title||'(untitled)'}" from "${ep.title||'(untitled)'}"\nPlatforms: ${plats.map(p=>PLAT_NAMES[p]).join(', ')}\n${stats}\nHook: ${perf.hookRating||'?'}/5 | Retention: ${perf.retentionNote||'—'}\nWorked: ${perf.whatWorked||'—'} | Change: ${perf.whatToChange||'—'}`;
  }).join('\n\n---\n\n');

  const prompt = `You are a content strategist for "The Biotech Voyager," a biotech science podcast.\n\nLast ${posted.length} posted clip performance:\n\n${clipData}\n\nIdentify ONE specific pattern in this data. Give ONE actionable change for the next clip. Be direct and concrete. Max 3 sentences.`;
  callClaude(prompt, 'ai-insight-result', 'ai-insight-btn', 'AI Insight');
}

function runGrowthPlan() {
  const a = bvAnalytics;
  const social = (a.ig||0) + (a.tiktok||0) + (a.x||0);
  const passed = [], upcoming = [];
  const groups = [
    {label:'YT Subs',   cur: a.ytSubs||0,  ms: MS.ytSubs},
    {label:'YT Views',  cur: a.ytViews||0, ms: MS.ytViews},
    {label:'Social',    cur: social,        ms: MS.social}
  ];
  for (const g of groups) {
    for (const m of g.ms) {
      const str = `${g.label} ${fmtNum(m.t)} ($${m.b.toLocaleString()})`;
      if (g.cur >= m.t) passed.push(str); else upcoming.push(str);
    }
  }
  const prompt = `You are a growth strategist for "The Biotech Voyager," a biotech science podcast.

Current metrics:
- YouTube: ${(a.ytViews||0).toLocaleString()} views, ${(a.ytSubs||0).toLocaleString()} subscribers
- YouTube Shorts: ${(a.shortsViews||0).toLocaleString()} views
- Instagram: ${(a.ig||0).toLocaleString()} | TikTok: ${(a.tiktok||0).toLocaleString()} | X: ${(a.x||0).toLocaleString()} | LinkedIn: ${(a.linkedin||0).toLocaleString()}
- Spotify: ${(a.spotify||0).toLocaleString()} | Apple Podcasts: ${(a.apple||0).toLocaleString()}
- Combined IG + TT + X: ${social.toLocaleString()}

Milestone bonuses:
- YouTube Subscribers: 1K ($500), 10K ($2,500), 50K ($10,000), 100K ($50,000)
- YouTube Views: 100K ($500), 1M ($5,000), 10M ($20,000)
- IG + TikTok + X: 5K ($1,000), 25K ($3,000), 100K ($10,000), 500K ($25,000)

Achieved: ${passed.slice(0,5).join(', ') || 'None yet'}
Next targets: ${upcoming.slice(0,4).join(', ')}

Write a specific 4-week action plan. Format exactly as:
WEEK 1: [2-3 specific actions]
WEEK 2: [2-3 specific actions]
WEEK 3: [2-3 specific actions]
WEEK 4: [2-3 specific actions]

Focus on biotech podcast growth. Be specific about content type, posting cadence, and platform.`;
  callClaude(prompt, 'growth-result', 'growth-btn', 'Generate 4-Week Plan');
}

/* ── UTILS ───────────────────────────────────── */
function escHtml(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── TABS ────────────────────────────────────── */
document.querySelectorAll('.bv-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.bv-tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.bv-tab-panel').forEach(p => p.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
    if (btn.dataset.tab === 'performance') renderPerformance();
  });
});
